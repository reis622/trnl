# MANUAL (Actions > bundles > Run workflow, pick the release tag). Builds:
#  - sdist + wheel -> PyPI (trusted publishing, no token needed once configured on pypi.org)
#  - standalone PyInstaller bundles (Windows x64, macOS arm64/x64, Linux x64) -> GitHub Release
#    used by Homebrew, Scoop, winget and AUR (trnl-bin). SHA256SUMS.txt is attached.
name: bundles
on:
  workflow_dispatch:
    inputs:
      tag: { description: "release tag, e.g. v1.1.0", required: true }
      pypi: { description: "also publish to PyPI (needs trusted publishing set up)", type: boolean, default: false }
permissions:
  contents: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pytest && pytest -q tests
  pypi:
    needs: test
    if: ${{ inputs.pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  bundles:
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: zip }
          - { os: macos-14, name: macos-arm64, ext: tar.gz }
          - { os: macos-13, name: macos-x64, ext: tar.gz }
          - { os: ubuntu-22.04, name: linux-x64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --console --name trnl
          --collect-binaries ctranslate2 --collect-binaries sentencepiece
          --collect-submodules ctranslate2 --hidden-import yaml --hidden-import platformdirs --exclude-module tkinter
          packaging/pyinstaller/launcher.py
      - run: ./dist/trnl/trnl --version
        shell: bash
      - name: archive
        shell: bash
        run: |
          V=${{ inputs.tag }}; V=${V#v}
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then 7z a -tzip ../trnl-$V-${{ matrix.name }}.zip trnl >/dev/null
          else tar czf ../trnl-$V-${{ matrix.name }}.tar.gz trnl; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: trnl-*.*
  checksums:
    needs: bundles
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" -p 'trnl-*'
          sha256sum trnl-* > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "${{ inputs.tag }}" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
